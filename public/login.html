<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>登录 · File Bridge</title>
  <link rel="stylesheet" href="/login.css" />
</head>

<body>
  <main class="shell">
    <section class="card">
      <div class="brand">
        <div class="brand-icon">↔</div>
        <div>
          <h1>File Bridge</h1>
          <p>请输入右侧图片中的数字</p>
        </div>
      </div>

      <form id="loginForm">
        <label for="password">验证码</label>
        <div class="captcha-row">
          <input id="password" type="text" maxlength="4" minlength="4" pattern="[0-9]{4}" inputmode="numeric" required
            autocomplete="one-time-code" autocapitalize="none" spellcheck="false" enterkeyhint="go"
            placeholder="输入 4 位数字" />
          <button id="refreshCaptcha" type="button" title="看不清？点击换一张" aria-label="刷新图片验证码"><img id="captchaImage"
              alt="四位数字图片验证码" /></button>
        </div>
        <button id="submitBtn" type="submit">进入</button>
      </form>
      <div id="message" class="message" role="status"></div>
      <p class="tip">连续输错 3 次，该 IP 将锁定 1 小时。</p>
    </section>
  </main>

  <script src="/login.js"></script>
</body>

</html>
